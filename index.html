<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Product Sans',sans-serif;
}

body{
    background:#000;
    color:white;
}

/* BACKGROUND */
.hero-bg{
    position:fixed;
    inset:0;
    background:url('https://i.postimg.cc/1XmHVwCD/IMG-3451.jpg');
    background-size:cover;
    background-position:center;
    z-index:-2;
}

.hero-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:-1;
}

/* TIME TOP LEFT WITH SPACE */
.top-time{
    position:fixed;
    top:6px;
    left:12px;
    z-index:30;
    font-size:14px;
    font-weight:700;
    color:white;
    opacity:0.9;
}

/* TOP BAR */
.top-bar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100px;
    z-index:10;
    background:rgba(20,20,22,0.35);
    backdrop-filter:blur(18px);
    display:flex;
    align-items:center;
    justify-content:center;
}

.search-box{
    width:55%;
    display:flex;
    align-items:center;
    background:rgba(255,255,255,0.08);
    border-radius:999px;
    padding:10px 14px;
}

.search-box input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-size:16px;
}

.search-box button{
    border:none;
    background:#4285f4;
    color:white;
    padding:8px 14px;
    border-radius:999px;
}

/* LIST */
.list{
    margin-top:110px;
    padding:20px 40px;
    height:calc(100vh - 110px);
    overflow-y:auto;
    position:relative;
    z-index:5;
}

.item{
    display:flex;
    align-items:center;
    gap:20px;
    padding:18px;
    border-radius:18px;
    margin-bottom:14px;
    background:rgba(255,255,255,0.05);
    transition:0.2s;
}

.item:hover{
    background:rgba(255,255,255,0.10);
    transform:scale(1.01);
}

.icon{
    width:70px;
    height:70px;
    border-radius:18px;
    background:#1c1d22;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.icon img{
    width:60%;
    height:60%;
    object-fit:contain;
}

.name{
    font-size:20px;
    font-weight:700;
}

.link{
    text-decoration:none;
    color:white;
    width:100%;
    display:flex;
    align-items:center;
    gap:20px;
}

</style>
</head>

<script>

function search(e){
    e.preventDefault();
    const v = document.getElementById("q").value;
    if(v){
        window.open("https://www.google.com/search?q=" + encodeURIComponent(v));
    }
}

function updateTime(){
    const now = new Date();

    let h = now.getHours();
    let m = now.getMinutes();
    let s = now.getSeconds();

    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;

    m = m < 10 ? "0" + m : m;
    s = s < 10 ? "0" + s : s;

    document.getElementById("time").innerText =
    `${h}:${m}:${s} ${ampm}`;
}

updateTime();
setInterval(updateTime,1000);

</script>
